[package]
name = "sim-conformance-packs"
version = "0.8.0"
edition.workspace = true
license.workspace = true
description = "Public neutral conformance packs and bootstrap checkers for SIM."
readme = "README.md"
publish = true
repository.workspace = true
homepage.workspace = true

[package.metadata.sim-recipes]
policy = "descriptor"
reason = "The recipe describes a pure injected-evidence checker contract."

[features]
# Native adapters built from another resolver root must select that root's
# exact lock explicitly. Ordinary standalone/package builds retain their own
# owner lock behavior.
external-resolver-lock = []

[dependencies]
sim-artifact-facet = "0.2.0"
sim-conformance-core = "0.3.0"
sim-kernel = "0.4.0"
sim-work-core = "0.3.0"

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
sha2 = "0.10"
sim-incremental-core = "0.5.0"
wat = "1"

[lints]
workspace = true
