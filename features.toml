schema = "sim.features"

[enforcement.audience]
user = "strict"
code = "strict"
framework = "advisory"

[enforcement.surface]
cli = "strict"
view = "strict"
view-edit = "strict"
docs = "advisory"

[enforcement.specimen]
user = "strict"
framework = "strict"
code = "advisory"

[enforcement.route]
major_entrypoints = "advisory"
frameworks = "advisory"

[[feature]]
id = "feature/sim-sdk/generated-docs"
title = "Repository documentation surface"
summary = "Publish generated package, card, recipe, and index facts for the SDK facade and conformance crate."
owner = "crate/xtask"
audiences = ["code"]
guidance = "Use this row when checking the generated documentation and index lane for the SDK repo."
claims_anchors = [
  "anchor/bin/sim",
  "anchor/cli/xtask",
  "anchor/crate/xtask",
  "anchor/doc/generated/feature-map",
  "anchor/doc/generated/sim-index-fragment",
]
claims_surfaces = [
  "cli/sim",
  "cli/xtask",
  "docs/sim-sdk/generated",
]

[[feature]]
id = "feature/sim-sdk/web-search-facade"
title = "Network-free web research facade and conformance"
summary = "Expose neutral HTTP, web, search, fetch, rank, office-evidence, and audit-view contracts behind one opt-in SDK feature, with a caller-owned fake-world proof."
owner = "crate/sim-nest"
audiences = ["user", "code", "framework"]
guidance = "Enable web-search and compose the reexported stable records and host traits. Provider-specific DTOs remain private to their codec; the default conformance fixture owns every input byte and opens no socket."
claims_anchors = ["anchor/rustdoc/sim-nest/web_search"]
claims_specimens = ["spec-test/sim-sdk/crates/sim-conformance/tests/web_search_offline", "recipe/sim-sdk/web-search/configured-searxng"]
presents = ["feature/sim-agent-net/reproducible-federated-research", "feature/sim-web/search-audit-surface"]

[[route]]
id = "route/sdk-search-research-audit"
task = "Run sim search research through deterministic conformance to the audit view"
audiences = ["user", "code", "framework"]
steps = [
  { feature = "feature/sim-run/search-command", why = "The bootloader selects the canonical search product." },
  { feature = "feature/sim-sdk/web-search-facade", why = "The SDK composes the stable public contracts and checked fake-world fixture." },
  { specimen = "spec-test/sim-sdk/crates/sim-conformance/tests/web_search_offline", why = "The fixture proves network-free query-to-citation replay and attack boundaries." },
  { feature = "feature/sim-web/search-audit-surface", why = "The inert view exposes ranking, capture, selector, office, and policy evidence." },
]

[[feature]]
id = "feature/sim-sdk/study-facade"
title = "Opt-in generic study facade"
summary = "Expose the canonical study lifecycle, staged design, report graph, selection, and command contracts behind one granular feature."
owner = "crate/sim-nest"
audiences = ["code", "framework"]
guidance = "Enable study and import sim::study. This is a direct facade over sim-lib-study; it adds no journal, statistics, executor, model, or selection policy."
claims_anchors = ["anchor/rustdoc/sim-nest/study"]
presents = ["feature/sim-runtime/domain-free-study-lifecycle"]

[[feature]]
id = "feature/sim-sdk/model-test-facade"
title = "Opt-in model observatory facade"
summary = "Expose the canonical model-test domain and loadable product behind one granular non-default SDK feature."
owner = "crate/sim-nest"
audiences = ["user", "code", "framework"]
guidance = "Enable model-test and import sim::model_test. The feature composes the canonical study and provider contracts but adds no provider authority, credentials, runner, scheduler, statistics, or model inventory, and it is absent from the minimal facade."
claims_anchors = ["anchor/rustdoc/sim-nest/model_test"]
presents = ["feature/sim-agent-net/model-test-product"]

[[route]]
id = "route/compose-model-observatory-from-sdk"
task = "Compose the provider-neutral model observatory from the SDK"
audiences = ["user", "code", "framework"]
steps = [
  { feature = "feature/sim-sdk/model-test-facade", why = "The granular feature exposes the canonical observatory without changing the minimal facade." },
  { feature = "feature/sim-agent-net/model-test-product", why = "The owning product supplies command semantics, offline projections, and deterministic evidence export." },
]

[[feature]]
id = "feature/sim-sdk/source-authority-facade"
title = "Shared source-authority facade"
summary = "Build diminished source requests through the canonical runtime authority, broker, and dynamic policy without guest-specific admission envelopes."
owner = "crate/sim-nest"
audiences = ["code", "framework"]
guidance = "Enable core and import sim::source_authority. Construct SourceAuthority only in trusted host code, then use ReadEvalRequest::new or DynamicSourcePolicy evaluation methods. The facade directly presents sim-lib-core contracts and adds no authority model or guest behavior."
claims_anchors = [
  "anchor/rustdoc/sim-nest/source_authority",
]
claims_specimens = [
  "recipe/sim-sdk/source-authority/dynamic-text",
]
presents = [
  "feature/sim-runtime/capabilities-read-eval",
]

[[feature]]
id = "feature/sim-sdk/characterization-facade"
title = "Characterization migration facade"
summary = "Capture public behavioral contracts before a refactor and compare canonical observations afterward through SDK-visible types."
owner = "crate/sim-nest"
audiences = ["code", "framework"]
guidance = "Enable standard-core and use sim::characterization. Declare a bounded ScenarioSpec, record canonical observations before and after a migration, and require compare_characterization_captures to return no differences. Inspect located differences instead of private implementation state when a contract changes."
claims_anchors = [
  "anchor/rustdoc/sim-nest/characterization",
]
claims_specimens = [
  "spec-test/sim-sdk/tests/characterization",
]
presents = [
  "feature/sim-runtime/characterization-captures",
]

[[feature]]
id = "feature/sim-sdk/standard-gc-policy"
title = "Standard distribution garbage-collection policy"
summary = "Select bounded tracing reclamation for standard builds while keeping hard-capped cycle retention explicit and test-only."
owner = "crate/sim-nest"
audiences = ["code", "framework"]
guidance = "Use the `standard` feature for production guests that allocate managed cyclic graphs. Import ManagedNode, ManagedArena, stable edge types, and (with tracing selected) ManagedHeap from `sim::gc`; keep language roles and payload policy open while reusing that substrate. Use `standard-gc-retain` only for an explicit minimal or test closure; inspect the selection with `gc::inspect_selected_policy`, and expect cyclic production admission to fail closed under retention."
claims_anchors = [
  "anchor/rustdoc/sim-nest/gc",
]
claims_specimens = [
  "spec-test/sim-sdk/src/gc",
]
presents = [
  "feature/sim-runtime/mutation-organ",
  "feature/sim-runtime/gc-tracing",
]
