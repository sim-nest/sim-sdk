schema = "sim.features"

[enforcement.audience]
user = "strict"
code = "strict"
framework = "advisory"

[enforcement.surface]
cli = "strict"
view = "strict"
view-edit = "strict"
docs = "advisory"

[enforcement.specimen]
user = "strict"
framework = "strict"
code = "advisory"

[enforcement.route]
major_entrypoints = "advisory"
frameworks = "advisory"

[[feature]]
id = "feature/sim-sdk/hotload-facade"
title = "Safe hot-generation SDK facade"
summary = "Expose immutable native build, admission, compatibility, atomic activation, and durable receipt records without exposing host provider implementations."
owner = "crate/sim-nest"
audiences = ["code", "framework"]
guidance = "Enable hotload and import sim::hotload. Compose the sandbox, storage, loader, and journal providers at the host boundary; pass only the facade-visible requests, candidates, reports, generations, and receipts through application code."
claims_anchors = ["anchor/rustdoc/sim-nest/hotload"]
claims_specimens = ["spec-test/sim-sdk/tests/hotload_generation", "recipe/sim-sdk/hotload/public-generation-loop", "spec-test/sim-sdk/tests/conversational_instrument_adoption", "recipe/sim-sdk/hotload/conversational-instrument-adoption"]
presents = ["feature/sim-run/immutable-native-build", "feature/sim-run/loadable-hot-generation"]

[[route]]
id = "route/sdk-public-hotload-generation-loop"
task = "Build and safely replace a native library generation through the public SDK"
audiences = ["code", "framework"]
steps = [
  { feature = "feature/sim-sdk/hotload-facade", why = "Use the focused facade records while keeping concrete host providers outside application code." },
  { specimen = "spec-test/sim-sdk/tests/hotload_generation", why = "Run the deterministic build, admission, activation, refusal, reclamation, and replay proof." },
  { specimen = "recipe/sim-sdk/hotload/public-generation-loop", why = "Reuse the two tiny sealed source generations from the cookbook surface." },
]

[[route]]
id = "route/sdk-conversational-instrument-adoption"
task = "Rebuild and atomically adopt a conversationally proposed instrument"
audiences = ["code", "framework"]
steps = [
  { feature = "feature/sim-agent-net/reproducible-instrument-adoption", why = "Use the canonical BRIDGE, ChangeCapsule, pack, rebuild, adoption, and rollback transaction." },
  { specimen = "recipe/sim-sdk/hotload/conversational-instrument-adoption", why = "Follow the checked conversation-free SDK recipe." },
]

[[feature]]
id = "feature/sim-sdk/layered-physics-facade"
title = "Layered physics SDK composition"
summary = "Curates one-way feature closures from quantities and physics core through audit, proof, studies, findings, and explicit adapters."
owner = "crate/sim-nest"
audiences = ["user", "code", "framework"]
guidance = "Start with numbers-quantity or physics-core and add only the required layer. Extended precision, FEMM, interference, and placement providers are independent opt-ins."
claims_anchors = ["anchor/rustdoc/sim-nest/physics"]
claims_specimens = ["recipe/sim-sdk/physics/switched-audit"]
presents = ["feature/sim-physics/loadable-runtime-composition"]

[[route]]
id = "route/sdk-switched-physics-audit"
task = "Compose a switched-boundary physics solve, audit, verdict, and finding projection"
steps = [{ feature = "feature/sim-sdk/layered-physics-facade", why = "Select the audit and findings closures without pulling adapter or provider stacks." }, { specimen = "recipe/sim-sdk/physics/switched-audit", why = "Inspect the complete composition and unresolved/certified verdict boundary." }]

[[feature]]
id = "feature/sim-sdk/media-edge-music-vertical"
title = "Media-edge music SDK composition"
summary = "Expose the owning music route plan and exact stream-host effect adapters behind one opt-in vertical feature."
owner = "crate/sim-nest"
audiences = ["user", "code", "framework"]
guidance = "Enable music-vertical and use sim::music_vertical; this facade composes the existing owner contracts and adds no generic command API or automation authority."
claims_anchors = ["anchor/rustdoc/sim-nest/music_vertical"]
claims_specimens = ["spec-test/sim-sdk/src/music_vertical"]
presents = ["feature/sim-music/media-edge-vertical", "feature/sim-stream-host/named-music-effects"]

